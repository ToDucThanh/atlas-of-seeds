[project]
name = "atlas-of-seeds"
version = "0.1.0"
description = "Type a number or a word, get a world, and scrub through its history on a spinning globe."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "flet-audio>=1.0.1",
    "flet-charts>=1.0.1",
    "flet[all]>=1.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "flet-mcp>=1.0.1",
]
